version: '3.8'

services:
  typesense:
    image: typesense/typesense:27.1
    container_name: soranauts-glossary-typesense
    ports:
      - "127.0.0.1:8108:8108"
    volumes:
      - typesense-data:/data
    command: --data-dir /data --api-key=${TYPESENSE_API_KEY:-dev} --enable-cors --listen-port=8108 --listen-address=0.0.0.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8108/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  typesense-data:
    driver: local

