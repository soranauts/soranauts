<!DOCTYPE html>
<html>
<head>
    <title>Debug Search</title>
</head>
<body>
    <h1>Search Debug</h1>
    <input type="text" id="searchInput" placeholder="Search..." />
    <div id="results"></div>

    <script type="module">
        import { search } from './dist/pagefind/pagefind.js';
        
        const searchInput = document.getElementById('searchInput');
        const results = document.getElementById('results');
        
        searchInput.addEventListener('input', async (e) => {
            const query = e.target.value;
            if (query.length < 2) return;
            
            try {
                const searchResult = await search(query);
                console.log('Search results:', searchResult);
                
                let html = '<h2>All Results:</h2>';
                searchResult.results.forEach((result, index) => {
                    html += `
                        <div style="border: 1px solid #ccc; margin: 10px 0; padding: 10px;">
                            <strong>Result ${index + 1}:</strong><br>
                            <strong>URL:</strong> ${result.url}<br>
                            <strong>ID:</strong> ${result.id}<br>
                            <strong>Score:</strong> ${result.score}<br>
                            <strong>Title:</strong> ${result.title || 'No title'}<br>
                            <strong>Excerpt:</strong> ${result.excerpt || 'No excerpt'}
                        </div>
                    `;
                });
                
                results.innerHTML = html;
            } catch (error) {
                console.error('Search error:', error);
                results.innerHTML = '<p>Error: ' + error.message + '</p>';
            }
        });
    </script>
</body>
</html>
