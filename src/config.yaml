site:
  name: Soranauts
  site: 'https://soranauts.com/'
  base: '/'
  trailingSlash: false

  googleSiteVerificationId: yXyKtMMJ86TxxPObH5ceyTloGUc2ZdXkVbTRV1xHso4

# Default SEO metadata
metadata:
  title:
    default: Soranauts
    template: #'%s — Soranauts'
  description: "Explore the SORA blockchain and Polkaswap, a decentralized exchange for seamless crypto swaps. Learn, trade, and join the SORA ecosystem today."
  robots:
    index: true
    follow: true
  openGraph:
    site_name: Soranauts
    images:
      - url: '~/assets/images/soranauts-social-share.jpg'
        width: 1200
        height: 630
    type: website
  twitter:
    handle: '@soranauts'
    site: '@soranauts'
    cardType: summary_large_image

i18n:
  language: en
  textDirection: ltr

apps:
  blog:
    isEnabled: true
    postsPerPage: 6

    post:
      isEnabled: true
      permalink: '/%slug%' # Variables: %slug%, %year%, %month%, %day%, %hour%, %minute%, %second%, %category%
      robots:
        index: true

    list:
      isEnabled: true
      pathname: 'blog' # Blog main path, you can change this to "articles" (/articles)
      robots:
        index: true

    category:
      isEnabled: true
      pathname: 'category' # Category main path /category/some-category, you can change this to "group" (/group/some-category)
      robots:
        index: true

    tag:
      isEnabled: true
      pathname: 'tag' # Tag main path /tag/some-tag, you can change this to "topics" (/topics/some-category)
      robots:
        index: false

analytics:
  vendors:
    googleAnalytics:
      id: null # or "G-XXXXXXXXXX"

ui:
  theme: 'system' # Values: "system" | "light" | "dark" | "light:only" | "dark:only"

  tokens:
    default:
      fonts:
        sans: InterVariable
        serif: var(--ph-font-sans)
        heading: var(--ph-font-sans)
      colors:
        default: rgb(16 16 16)
        heading: rgb(0 0 0)
        muted: rgb(40 40 40)
        bgPage: rgb(255 255 255)
        primary: rgb(227 36 45)
        secondary: rgb(180 29 34)
        accent: rgb(239 68 68)
        info: rgb(119 182 234)
        success: rgb(54 211 153)
        warning: rgb(251 189 35)
        error: rgb(248 114 114)
        link: rgb(59 130 246)
        linkActive: var(--ph-color-link)
    dark:
      fonts: {}
      colors:
        default: rgb(247, 248, 248)
        heading: rgb(247, 248, 248)
        muted: rgb(200, 188, 208)
        bgPage: rgb(3 6 32)
        primary: rgb(29 78 216)
        secondary: rgb(30 58 138)
        accent: rgb(135 77 2267)
        info: rgb(58 191 248)
        success: rgb(54 211 153)
        warning: rgb(251 189 35)
        error: rgb(248 114 114)
        link: rgb(59 130 246)
        linkActive: var(--ph-color-link)
