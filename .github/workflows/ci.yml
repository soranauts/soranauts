name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.12.2
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
        
      - name: Verify no protected paths modified
        run: |
          PROTECTED=$(git diff --name-only origin/main...HEAD | \
            grep -E "^apps/web/src/(content|pages|data/sora-glossary|data/taxonomy)|^apps/web/public/" || true)
          if [ -n "$PROTECTED" ]; then
            echo "❌ Protected paths modified:"
            echo "$PROTECTED"
            exit 1
          fi
          echo "✅ No protected paths modified"
        
      - name: Build packages
        run: pnpm --filter @soranauts/config build
        
      # Temporarily disabled until TypeScript errors are resolved
      # - name: Type check
      #   run: pnpm -w typecheck
        
      - name: Lint
        run: pnpm -w lint
        
      - name: Build web app
        working-directory: apps/web
        run: pnpm build
        
      - name: Run unit tests
        working-directory: apps/web
        run: pnpm test:unit
        
      # Temporarily disabled - E2E tests require dev server
