name: Weekly Glossary Snapshot

on:
  schedule:
    # Run every Sunday at 3 AM UTC
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force snapshot even if no changes'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  snapshot:
    name: Create Glossary Snapshot
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: 'pnpm'
          
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        
      - name: Build glossary data
        run: pnpm glossary:build
        
      - name: Create snapshot
        run: pnpm ops:snapshot
        
      - name: Upload snapshot artifact
        uses: actions/upload-artifact@v6
        with:
          name: glossary-snapshot-${{ github.run_number }}
          path: backups/glossary/
          retention-days: 90
          
      - name: Check for changes
        id: changes
        run: |
          if [ -n "$(git status --porcelain backups/)" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi
          
      - name: Commit snapshot to repository
        if: steps.changes.outputs.has_changes == 'true' || inputs.force == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add backups/
          git commit -m "chore: weekly glossary snapshot [skip ci]" || echo "No changes to commit"
          git push || echo "Push failed - may need permissions"
        continue-on-error: true

  notify:
    name: Notify on Completion
    runs-on: ubuntu-latest
    needs: snapshot
    if: always()
    
    steps:
      - name: Report status
        run: |
          if [ "${{ needs.snapshot.result }}" == "success" ]; then
            echo "✅ Glossary snapshot completed successfully"
          else
            echo "❌ Glossary snapshot failed"
            exit 1
          fi


