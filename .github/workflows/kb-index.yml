name: Reindex on KB or Article changes

on:
  # Disabled automatic triggers - run manually only until pipeline is fixed
  # push:
  #   paths:
  #     - 'knowledge_base/**'
  #     - 'apps/web/src/content/post/**'
  #   branches: [main]  # Only run on main branch pushes
  workflow_dispatch:  # Manual trigger only
  # pull_request:
  #   paths:
  #     - 'knowledge_base/**'
  #     - 'apps/web/src/content/post/**'

env:
  INGEST_ENABLED: ${{ vars.INGEST_ENABLED || 'false' }}

jobs:
  index:
    concurrency:
      group: kb-ingest-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    # Don't block PR merges if indexing fails (useful if secrets aren't configured)
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
      actions: read

    services:
      chroma:
        image: ghcr.io/chroma-core/chroma:latest
        ports:
          - 8000:8000
        env:
          CHROMA_SERVER_HOST: 0.0.0.0
          CHROMA_SERVER_HTTP_PORT: 8000
          ALLOW_RESET: "TRUE"
          IS_PERSISTENT: "TRUE"
        options: >-
          --health-cmd "curl -fsS http://127.0.0.1:8000/api/v1/heartbeat || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 15s
    
    steps:
      - name: Abort when ingest disabled
        if: env.INGEST_ENABLED != 'true' && github.event_name != 'workflow_dispatch'
        run: |
          echo "INGEST_ENABLED=${INGEST_ENABLED:-unset}; skipping."
          exit 0
      - name: Checkout code
        uses: actions/checkout@v6
        
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.2
          
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'
          
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        
      - name: Wait for Chroma health check
        run: |
          echo "Waiting for Chroma to be ready..."
          for i in {1..30}; do
            if curl -f http://127.0.0.1:8000/api/v1/heartbeat > /dev/null 2>&1; then
              echo "Chroma is ready!"
              curl -s http://127.0.0.1:8000/api/v1/heartbeat | jq -r '.nanosecond heartbeat' || echo "Heartbeat OK"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "Chroma failed to start after 30 attempts"
              exit 1
            fi
            echo "Attempt $i/30: waiting 2s..."
            sleep 2
          done
        
      - name: Determine changed files
        id: changed-files
        run: |
          if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            # Initial commit - index everything
            echo "changed=all" >> $GITHUB_OUTPUT
          else
            # Use git diff to find changed files, handling merge commits
            CHANGED=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep -E '^knowledge_base/|^apps/web/src/content/post/' || echo "")
            if [ -z "$CHANGED" ]; then
              echo "changed=none" >> $GITHUB_OUTPUT
            else
              echo "changed=some" >> $GITHUB_OUTPUT
            fi
          fi
          
      - name: Restore index cache
        uses: actions/cache@v4
        with:
          path: knowledge_base/.kb_index
          key: kb-index-${{ vars.EMBED_MODEL || 'text-embedding-3-large' }}-${{ vars.TOKENIZER || 'tiktoken-cl100k' }}-${{ hashFiles('knowledge_base/curated/**') }}
          restore-keys: |
            kb-index-${{ vars.EMBED_MODEL || 'text-embedding-3-large' }}-${{ vars.TOKENIZER || 'tiktoken-cl100k' }}-
      
      - name: Build BM25 index
        if: steps.changed-files.outputs.changed != 'none'
        run: |
          pnpm --filter @soranauts/web kb:bm25:build || echo "BM25 build skipped"
          
      - name: Ingest and index
        if: steps.changed-files.outputs.changed != 'none'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EMBED_MODEL: ${{ vars.EMBED_MODEL || 'text-embedding-3-large' }}
          TOKENIZER: ${{ vars.TOKENIZER || 'tiktoken-cl100k' }}
          CHROMA_URL: http://127.0.0.1:8000
          CHROMA_STRICT: "1"
          CI: "1"
        run: |
          echo "Chroma URL: $CHROMA_URL"
          echo "Running ingestion with strict mode..."
          pnpm --filter @soranauts/web kb:ingest:ci
          
      - name: Upload index manifest
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: kb-index-manifest
          path: knowledge_base/.kb_index/manifest.json
          retention-days: 7
          if-no-files-found: ignore
          
      - name: Cache index
        if: success()
        uses: actions/cache@v4
        with:
          path: knowledge_base/.kb_index
          key: kb-index-${{ vars.EMBED_MODEL || 'text-embedding-3-large' }}-${{ vars.TOKENIZER || 'tiktoken-cl100k' }}-${{ hashFiles('knowledge_base/curated/**') }}
          restore-keys: |
            kb-index-${{ vars.EMBED_MODEL || 'text-embedding-3-large' }}-${{ vars.TOKENIZER || 'tiktoken-cl100k' }}-

