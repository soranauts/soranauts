name: Content CI

on:
  pull_request:
    paths:
      - 'apps/web/src/content/glossary/**/*.mdx'
      - 'scripts/lint-content.ts'
      - 'scripts/validate-frontmatter.ts'
      - 'scripts/build-nexus-glossary-json.ts'
      - 'schemas/**'

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  content-checks:
    name: Content Quality Checks
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        
      - name: Run content linter
        run: pnpm content:lint
        continue-on-error: true
        
      - name: Run front-matter validation
        run: pnpm content:validate
        
      - name: Build glossary
        run: pnpm glossary:build
        
      - name: Upload lint report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: content-lint-report
          path: content-lint-report.md
          retention-days: 7
          
      - name: Comment on PR with summary
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const fs = require('fs');
            
            let report = '';
            try {
              report = fs.readFileSync('content-lint-report.md', 'utf8');
            } catch (e) {
              report = 'No lint report generated.';
            }
            
            // Extract summary from report
            const summaryMatch = report.match(/## Summary[\s\S]*?\| \*\*Total\*\* \| \*\*(\d+)\*\* \|/);
            const totalIssues = summaryMatch ? summaryMatch[1] : '0';
            
            const body = `## 📝 Content Quality Report
            
            **Total Issues:** ${totalIssues}
            
            <details>
            <summary>View Full Report</summary>
            
            ${report}
            
            </details>
            
            ---
            *This comment is automatically generated by the Content CI workflow.*`;
            
            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('📝 Content Quality Report')
            );
            
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }

