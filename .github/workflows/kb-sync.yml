  index:
    needs: [sync_iroha, sync_soramitsu, import_medium, import_polkaswap, import_fearless, sync_fearless_github, sync_wiki, sync_tonswap, import_tonswap_medium]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      
      - name: Restore index cache
        uses: actions/cache@v4
        with:
          path: knowledge_base/.kb_index
          key: kb-index-${{ runner.os }}-${{ hashFiles('knowledge_base/.kb_index/manifest.json') }}
          restore-keys: |
            kb-index-${{ runner.os }}-
            
      - name: Build BM25 index
        run: pnpm --filter @soranauts/web kb:bm25:build
        
      - name: Ingest and index
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: pnpm --filter @soranauts/web kb:ingest
        
      - name: Upload index manifest
        uses: actions/upload-artifact@v4
        with:
          name: kb-index-manifest
          path: knowledge_base/.kb_index/manifest.json
          retention-days: 30
          
      # Note: knowledge_base/ files are auto-generated daily and should NOT be committed
      # They are excluded from git via .gitignore. The sync workflow runs locally
      # and the files are available for the build process without needing to be in git.

