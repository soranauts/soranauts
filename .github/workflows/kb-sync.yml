name: KB Nightly Sync

on:
  schedule:
    - cron: "0 3 * * *" # Daily at 03:00 UTC (incremental sync is cheap ~$0.12/month)
  workflow_dispatch:

env:
  INGEST_ENABLED: ${{ vars.INGEST_ENABLED || 'false' }}

concurrency:
  group: kb-ingest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync_iroha:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      RETRY_COUNT: 3
      RETRY_DELAY: 10
    steps:
      - name: Abort when ingest disabled
        if: env.INGEST_ENABLED != 'true' && github.event_name != 'workflow_dispatch'
        run: |
          echo "INGEST_ENABLED=${INGEST_ENABLED:-unset}; skipping."
          exit 0
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Sync Iroha docs (with retry)
        run: |
          n=0
          until [ "$n" -ge "$RETRY_COUNT" ]; do
            pnpm --filter @soranauts/web kb:sync:iroha && break
            n=$((n+1))
            echo "Retry $n/$RETRY_COUNT after $RETRY_DELAY sec..."
            sleep "$RETRY_DELAY"
          done
      
