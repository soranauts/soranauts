        if: env.INGEST_ENABLED != 'true' && github.event_name != 'workflow_dispatch'
        run: |
          echo "INGEST_ENABLED=${INGEST_ENABLED:-unset}; skipping."
          exit 0
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Scrape TONSWAP site (with retry)
        run: |
          n=0
          success=false
          until [ "$n" -ge "$RETRY_COUNT" ]; do
            if pnpm --filter @soranauts/web kb:sync:tonswap; then
              success=true
              break
            fi
            n=$((n+1))
            if [ "$n" -lt "$RETRY_COUNT" ]; then
              echo "Retry $n/$RETRY_COUNT after $RETRY_DELAY sec..."
              sleep "$RETRY_DELAY"
            fi
          done
          if [ "$success" != "true" ]; then
            echo "❌ TONSWAP site scrape failed after $RETRY_COUNT attempts"
            exit 1
          fi

