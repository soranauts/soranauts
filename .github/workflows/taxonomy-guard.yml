name: Taxonomy Guard

on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - "apps/web/vercel.json"
      - "scripts/glossary-audit.ts"
      - "scripts/glossary-utils.ts"
      - "scripts/test-glossary-snapshot.ts"
      - "tools/guard_vercel_glossary.sh"
      - "package.json"
      - "pnpm-lock.yaml"
      - "docs/taxonomy-audit.md"
      - ".github/workflows/taxonomy-guard.yml"

permissions:
  contents: read

jobs:
  taxonomy-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 9.12.2
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit glossary references
        run: pnpm taxonomy:audit --debug
      - name: Snapshot glossary redirects
        run: pnpm taxonomy:test:snapshot
      - name: Guard non-glossary redirects
        run: pnpm taxonomy:guard

