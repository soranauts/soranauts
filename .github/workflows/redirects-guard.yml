name: Redirects Guard

on:
  schedule:
    - cron: "17 6 * * *"
  pull_request:
    paths:
      - apps/web/vercel.json
      - apps/web/scripts/verify-glossary-redirects.sh
      - .github/workflows/redirects-guard.yml
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify production redirects
        run: bash apps/web/scripts/verify-glossary-redirects.sh
