name: Redirects Guard

on:
  workflow_dispatch: {}
  schedule:
    - cron: "17 6 * * *"
  pull_request:
    paths:
      - "apps/web/vercel.json"
      - "apps/web/scripts/verify-glossary-redirects.sh"
      - ".github/workflows/redirects-guard.yml"

jobs:
  verify:
    strategy:
      fail-fast: false
      max-parallel: 1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
      - name: Verify production redirects (retry x2)
        run: |
          set -e
          bash apps/web/scripts/verify-glossary-redirects.sh || (sleep 5 && bash apps/web/scripts/verify-glossary-redirects.sh)
