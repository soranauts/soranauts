name: Web E2E

on:
  push:
    paths:
      - "apps/web/**"
      - ".github/workflows/web-e2e.yml"
  pull_request:
    paths:
      - "apps/web/**"
      - ".github/workflows/web-e2e.yml"
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      GLOSSARY_SEARCH_V2: "true"
      TAG_HUB_V1: "true"
      FEATURE_GLOSSARY_V2025: "true"
      FEATURE_GLOSSARY_ALIAS_REDIRECT: "true"
      NEXT_PUBLIC_FEATURE_GLOSSARY_ALIAS_REDIRECT: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.2

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @soranauts/web exec playwright install --with-deps chromium

      - name: Build workspace
        run: pnpm -w build

      - name: Run web e2e tests
        run: pnpm --filter @soranauts/web e2e


